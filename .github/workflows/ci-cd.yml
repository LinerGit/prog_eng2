    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore rashodniki-service/RashodnikiService.csproj
      - run: dotnet build rashodniki-service/RashodnikiService.csproj -c Release --no-restore

  docker-rashodniki-service:
