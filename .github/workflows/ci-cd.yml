name: CI/CD Warehouse

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/warehouse

jobs:
  # ============================================================
  # BUILD USERS SERVICE
  # ============================================================
  build-users-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore users-service/UsersService.csproj
      - run: dotnet build users-service/UsersService.csproj -c Release --no-restore
      - run: dotnet publish users-service/UsersService.csproj -c Release -o /tmp/users

  docker-users-service:
    needs: build-users-service
    runs-on: ubuntu-latest

    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push users-service
        uses: docker/build-push-action@v5
        with:
          context: ./users-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-users-service:latest

  deploy-users-service:
    needs: docker-users-service
    runs-on: ubuntu-latest

    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy users-service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/warehouse
            docker compose pull users-service
            docker compose up -d users-service
            docker image prune -f

  # ============================================================
  # BUILD ADDTOVAR SERVICE
  # ============================================================
  build-addtovar-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore addtovar-service/AddTovarService.csproj
