          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push vtovar-service
        uses: docker/build-push-action@v5
        with:
          context: ./vtovar-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-vtovar-service:latest

  deploy-vtovar-service:
    needs: docker-vtovar-service
    runs-on: ubuntu-latest

    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy vtovar-service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/warehouse
            docker compose pull vtovar-service
            docker compose up -d vtovar-service
            docker image prune -f

  # ============================================================
  # BUILD RETURN SERVICE
  # ============================================================
  build-return-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore return-service/ReturnService.csproj
      - run: dotnet build return-service/ReturnService.csproj -c Release --no-restore

  docker-return-service:
    needs: build-return-service
    runs-on: ubuntu-latest

    if: github.event_name == 'push' &&
