name: CI/CD Warehouse

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/warehouse

jobs:
  # ─── BUILD & TEST ──────────────────────────────────────────────
  build-users-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore users-service/UsersService.csproj
      - run: dotnet build users-service/UsersService.csproj -c Release --no-restore
      - run: dotnet publish users-service/UsersService.csproj -c Release -o /tmp/users

  build-addtovar-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore addtovar-service/AddTovarService.csproj
      - run: dotnet build addtovar-service/AddTovarService.csproj -c Release --no-restore
      - run: dotnet publish addtovar-service/AddTovarService.csproj -c Release -o /tmp/addtovar

  build-vtovar-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore vtovar-service/VTovarService.csproj
      - run: dotnet build vtovar-service/VTovarService.csproj -c Release --no-restore
      - run: dotnet publish vtovar-service/VTovarService.csproj -c Release -o /tmp/vtovar

  build-return-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore return-service/ReturnService.csproj
      - run: dotnet build return-service/ReturnService.csproj -c Release --no-restore

  build-rashodniki-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore rashodniki-service/RashodnikiService.csproj
      - run: dotnet build rashodniki-service/RashodnikiService.csproj -c Release --no-restore

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --configuration production
        working-directory: frontend
  build-ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ticket/Ticket.csproj
      - run: dotnet build ticket/Ticket.csproj -c Release --no-restore
      - run: dotnet publish ticket/Ticket.csproj -c Release -o /tmp/ticket

  # ─── DOCKER BUILD & PUSH (только на push в main) ─────────────
  docker-push:
    needs:
      - build-users-service
      - build-addtovar-service
      - build-vtovar-service
      - build-return-service
      - build-rashodniki-service
      - build-frontend
      - build-ticket
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push users-service
        uses: docker/build-push-action@v5
        with:
          context: ./users-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-users-service:latest

      - name: Build & push addtovar-service
        uses: docker/build-push-action@v5
        with:
          context: ./addtovar-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-addtovar-service:latest

      - name: Build & push vtovar-service
        uses: docker/build-push-action@v5
        with:
          context: ./vtovar-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-vtovar-service:latest

      - name: Build & push return-service
        uses: docker/build-push-action@v5
        with:
          context: ./return-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-return-service:latest

      - name: Build & push rashodniki-service
        uses: docker/build-push-action@v5
        with:
          context: ./rashodniki-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-rashodniki-service:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

      - name: Build & push ticket
        uses: docker/build-push-action@v5
        with:
          context: ./ticket
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ticket:latest

  # ─── DEPLOY (на push в main, после docker-push) ───────────────
  deploy:
    needs: docker-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/warehouse
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f
